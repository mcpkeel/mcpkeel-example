name: MCP drift
# Fails when a server no longer matches mcp.lock, and uploads the changes to
# GitHub code scanning. Runs on pull requests, and every day, because a server
# can change without any commit here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10
      - uses: mcpkeel/mcpkeel@v0.4.0
        with:
          probe: true
          sarif: mcpkeel.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: mcpkeel.sarif
          category: mcpkeel
