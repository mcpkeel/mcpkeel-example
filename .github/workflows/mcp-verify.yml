name: MCP drift
# Fails when a server no longer matches mcp.lock, and uploads the changes to
# GitHub code scanning. Runs on pull requests, and every day, because a server
# can change without any commit here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: mcpkeel/mcpkeel@b07af87b7cace55d2f356478a5c5774cf26026aa # v0.4.1
        with:
          probe: true
          sarif: mcpkeel.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: mcpkeel.sarif
          category: mcpkeel
