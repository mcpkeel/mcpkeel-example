name: MCP drift
# Fails when a server no longer matches mcp.lock, and uploads the changes to
# GitHub code scanning. Runs on pull requests, and every day, because a server
# can change without any commit here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: mcpkeel/mcpkeel@736aed0367801d822f44e386c810c5c1445d5d72 # v0.6.1
        with:
          probe: true
          sarif: mcpkeel.sarif
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        if: always()
        with:
          sarif_file: mcpkeel.sarif
          category: mcpkeel
