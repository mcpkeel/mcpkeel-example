name: MCP lockfile
# Once a week, accept whatever the servers send now on a branch, and open a
# pull request with the report. Merge it to accept the change, close it to
# keep the current baseline.
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: mcpkeel/mcpkeel@443d49bcf861c66f418ce4b65bf505f7dd9037b8 # v0.5.0
        with:
          mode: update-pr
