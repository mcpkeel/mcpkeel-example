        "command": "npx"
      },
      "tools": {
        "append_file": {
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "description": "Append text to the end of a file, creating the file if it does not exist. The existing content is never changed or replaced. The text is appended exactly as given, with no newline added before or after it, so end it with a newline if the next append should start on a new line. Only works within allowed directories.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "content": {
                "description": "Text to append, exactly as given. No newline is added: end it with \\n if the next append should start on a new line.",
                "type": "string"
              },
              "path": {
                "description": "The file to append to; it is created if it does not exist. Absolute, or relative to an allowed directory; it must resolve inside the allowed directories.",
                "type": "string"
              }
            },
            "required": [
              "content",
              "path"
            ],
            "type": "object"
          },
          "integrity": "sha256-4K+c2uKraRbqFEsXmKFCZvJttvrEpBSdVGJjOJgk8rQ=",
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "type": "string"
              }
            },
            "required": [
              "content"
            ],
            "type": "object"
          },
          "title": "Append File"
        },
        "copy_file": {
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "description": "Copy a file to a new location, without reading its content into the conversation. Copies one regular file, keeping its permissions and modification time; directories are not copied. If the destination exists, the operation will fail: it never overwrites. Both source and destination must be within allowed directories.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "destination": {
                "description": "Where to create the copy; nothing may exist there yet",
                "type": "string"
              },
              "source": {
                "description": "The file to copy",
                "type": "string"
              }
            },
            "required": [
              "destination",
              "source"
            ],
            "type": "object"
          },
          "integrity": "sha256-v5nFdbKnvbGcmIXmrxnaiMio7BePsL/7Jy6ptADJrmg=",
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "type": "string"
              }
            },
            "required": [
              "content"
            ],
            "type": "object"
          },
          "title": "Copy File"
        },
        "create_directory": {
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "description": "Create a new directory or ensure a directory exists. Can create multiple nested directories in one operation. If the directory already exists, this operation will succeed silently. Perfect for setting up directory structures for projects or ensuring required paths exist. Only works within allowed directories.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "description": "The directory to create, with any missing parents; an existing directory is left as is. Absolute, or relative to an allowed directory; it must resolve inside the allowed directories.",
                "type": "string"
              }
            },
            "required": [
              "path"
            ],
            "type": "object"
          },
          "integrity": "sha256-SgXrkaFLXYEWc1KJ27Ko/CE7yRZffm6yIx1ThZMF3b8=",
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "type": "string"
              }
            },
            "required": [
              "content"
            ],
            "type": "object"
          },
          "title": "Create Directory"
        },
        "directory_tree": {
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "description": "Get a recursive tree view of files and directories as a JSON structure. Each entry includes 'name', 'type' (file/directory), and 'children' for directories. Files have no children array, while directories always have a children array (which may be empty), except at the last level when 'depth' limits the tree: those directories are not read and have no children array. The output is formatted with 2-space indentation for readability. Only works within allowed directories.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "depth": {
                "description": "How many levels to descend: 1 lists only the entries directly in path. Directories at the last level have no children array. Omit for the whole tree.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "excludePatterns": {
                "default": [],
                "description": "Patterns for entries to leave out, with their contents, matched against each entry's path relative to path. A pattern with no '*' matches that name at any depth ('node_modules' leaves out every node_modules directory); a pattern with '*' is a glob matched as written, and one ending in '/**' also leaves out the directory it names.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "path": {
                "description": "The directory at the root of the tree. Absolute, or relative to an allowed directory; it must resolve inside the allowed directories.",
                "type": "string"
              }
            },
            "required": [
              "path"
            ],
            "type": "object"
          },
          "integrity": "sha256-KHrbPem4QJw7Jnnw0OhUMWgl9OKrTdJJRzAlu/DBOOE=",
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "type": "string"
              }
            },
            "required": [
              "content"
            ],
            "type": "object"
          },
          "title": "Directory Tree"
        },
        "edit_file": {
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "description": "Make line-based edits to a text file. Edits apply in order, each to the result of the ones before it, and each replaces the first match of its oldText with newText. oldText must match the file's text exactly, except that line endings (LF or CRLF) never matter and, when there is no exact match, a run of whole lines matches if each line is equal once leading and trailing whitespace is ignored (newText then takes the file's indentation). Whitespace inside a line must match. If any edit has no match, nothing is written and the error shows the closest lines of the file, numbered, to copy oldText from. Returns a git-style diff showing the changes made. Only works within allowed directories.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dryRun": {
                "default": false,
                "description": "Preview changes using git-style diff format",
                "type": "boolean"
              },
              "edits": {
                "description": "The replacements to make, applied in order, each to the result of the ones before it. If any one has no match, none is written.",
                "items": {
                  "properties": {
                    "newText": {
                      "description": "Text to replace with",
                      "type": "string"
                    },
                    "oldText": {
                      "description": "Text to search for - must match exactly",
                      "type": "string"
                    }
                  },
                  "required": [
                    "newText",
                    "oldText"
                  ],
                  "type": "object"
                },
                "type": "array"
              },
              "path": {
                "description": "The text file to edit. Absolute, or relative to an allowed directory; it must resolve inside the allowed directories.",
                "type": "string"
              }
            },
            "required": [
              "edits",
              "path"
            ],
            "type": "object"
          },
          "integrity": "sha256-fk0XL4mycVuyxHiDX9EubbBlu3yo+l/KrmWVp70RBlE=",
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "type": "string"
              }
            },
            "required": [
              "content"
            ],
            "type": "object"
          },
          "title": "Edit File"
        },
        "get_file_info": {
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "description": "Retrieve detailed metadata about a file or directory. Returns comprehensive information including size, creation time, last modified time, permissions, type and hard-link count. This tool is perfect for understanding file characteristics without reading the actual content. Only works within allowed directories.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "description": "The file or directory to describe. Absolute, or relative to an allowed directory; it must resolve inside the allowed directories.",
                "type": "string"
              }
            },
            "required": [
              "path"
            ],
            "type": "object"
          },
          "integrity": "sha256-WcswJBQRWT0pp70bsZ7IlgGFeX5SgSZyB6w7YRRoIEI=",
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "type": "string"
              }
            },
            "required": [
              "content"
            ],
            "type": "object"
          },
          "title": "Get File Info"
        },
