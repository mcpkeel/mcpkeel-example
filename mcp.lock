    "sequential-thinking": {
      "integrity": "sha256-IuMj9Wf//QHGIVRzS4VnGvO+jqh+us2NfpHHJ8xIqTE=",
      "package": {
        "ecosystem": "npm",
        "integrity": "sha512-yvj9eotCoXX7BLmyOKdajnCYB5vgeCS3YwtEU0wCIcVgl+xvCdBtjkd0CTA45Ljh2+Iv1538n28VAnrstps1Tg==",
        "name": "@modelcontextprotocol/server-sequential-thinking",
        "version": "2.1.1"
      },
      "serverInfo": {
        "name": "sequential-thinking-server",
        "version": "2.1.1"
      },
      "source": {
        "args": [
          "-y",
          "@modelcontextprotocol/server-sequential-thinking@2.1.1"
        ],
        "command": "npx"
      },
      "tools": {
        "sequentialthinking": {
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "description": "A detailed tool for dynamic and reflective problem-solving through thoughts.\nEach thought can build on, question, or revise previous insights as understanding deepens.\n\nWhen to use this tool:\n- Breaking down complex problems into steps\n- Planning and design with room for revision\n- Analysis that might need course correction\n- Problems where the full scope might not be clear initially\n- Tasks that need to maintain context over multiple steps\n- Situations where irrelevant information needs to be filtered out\n\nYou should:\n1. Estimate totalThoughts up front and adjust it up or down as you go; thoughtNumber may exceed it\n2. Question or revise earlier thoughts (isRevision with revisesThought), or branch (branchFromThought with branchId)\n3. Express uncertainty, and ignore information irrelevant to the current step\n4. Generate a solution hypothesis, verify it against the earlier steps, and repeat until satisfied\n5. Set nextThoughtNeeded to false only when truly done and a satisfactory answer is reached",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "branchFromThought": {
                "description": "Branching point thought number",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "branchId": {
                "description": "Branch identifier",
                "type": "string"
              },
              "isRevision": {
                "description": "Whether this revises previous thinking",
                "type": [
                  "boolean",
                  "string"
                ]
              },
              "needsMoreThoughts": {
                "description": "If more thoughts are needed",
                "type": [
                  "boolean",
                  "string"
                ]
              },
              "nextThoughtNeeded": {
                "description": "Whether another thought step is needed",
                "type": [
                  "boolean",
                  "string"
                ]
              },
              "revisesThought": {
                "description": "Which thought is being reconsidered",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "thought": {
                "description": "Your current thinking step",
                "type": "string"
              },
              "thoughtNumber": {
                "description": "Current thought number (numeric value, e.g., 1, 2, 3)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "totalThoughts": {
                "description": "Estimated total thoughts needed (numeric value, e.g., 5, 10)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [
              "nextThoughtNeeded",
              "thought",
              "thoughtNumber",
              "totalThoughts"
            ],
            "type": "object"
          },
          "integrity": "sha256-yHyBVCyMQ2C0ZB5dYrt+Am1pW4kjqerMZKGce8nVmhw=",
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "branches": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "nextThoughtNeeded": {
                "type": "boolean"
              },
              "thoughtHistoryLength": {
                "type": "number"
              },
              "thoughtNumber": {
                "type": "number"
              },
              "totalThoughts": {
                "type": "number"
              }
            },
            "required": [
              "branches",
              "nextThoughtNeeded",
              "thoughtHistoryLength",
              "thoughtNumber",
              "totalThoughts"
            ],
            "type": "object"
          },
          "title": "Sequential Thinking"
        }
      },
      "transport": "stdio"
    },
